# k8s/deployment.yaml — P1 hardening (resources, probes, securityContext)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isabella-ai-genesis
  labels:
    app: isabella-ai-genesis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: isabella-ai-genesis
  template:
    metadata:
      labels:
        app: isabella-ai-genesis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: isabella
          # ISA-355: sin tag mutable `latest`. Pin a la release versionada de
          # package.json (4.3.3). El pin definitivo es por digest
          # (image@sha256:...); verificar con `pnpm k8s:image:verify
          # --require-digest` una vez resuelto el digest real del registro.
          image: ghcr.io/osopanda1/isabella-ai-genesis:4.3.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: isabella-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: isabella-ai-genesis
spec:
  selector:
    app: isabella-ai-genesis
  ports:
    - port: 80
      targetPort: 3000
