title = "Isabella Genesis — controlled secret scanning"

[extend]
useDefault = true

# A retired credential was present in historical repository material before rotation.
# This exact value is allowlisted narrowly so historical scanning remains active for
# every other secret. The live application and documentation must never contain it.
[allowlist]
description = "Known retired CROWN credential from historical incident; exact value only"
regexTarget = "secret"
regexes = [
  '''C869C1B14A8938785A9438060AD878711124F416'''
]
