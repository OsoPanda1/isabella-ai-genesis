name: FGAIS Production Gate

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, "feat/**", "chore/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgais-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.16.0"
  PNPM_VERSION: "10.15.0"
  SANITIZE_STRICT: "true"

jobs:
  verify:
    name: FGAIS Production Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Repository hygiene
        run: node scripts/sanitize-repo.mjs

      - name: Security scan
        run: pnpm security:scan

      - name: Capability contract
        run: pnpm capabilities

      - name: Route contract
        run: pnpm audit:routes

      - name: Migration verification
        run: pnpm db:verify

      - name: Production integrity gate
        run: pnpm production:integrity

      - name: Production preflight
        run: pnpm production:preflight

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Validate Vercel/Nitro output
        run: |
          test -f .vercel/output/config.json || test -d .output || test -d dist

      - name: Build evidence
        run: |
          if test -d .vercel/output; then ROOT=.vercel/output;
          elif test -d .output; then ROOT=.output;
          else ROOT=dist; fi
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > build-sha256.txt

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: isabella-build-${{ github.sha }}
          path: build-sha256.txt
          retention-days: 30
