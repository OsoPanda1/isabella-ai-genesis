name: FGAIS Production Gate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.15.4"
  SANITIZE_STRICT: "true"

jobs:
  verify:
    name: FGAIS Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify toolchain pins
        run: |
          test "$(node --version)" = "v24.11.0"
          test "$(pnpm --version)" = "10.15.4"
          test "$(cat .nvmrc | tr -d '\\r\\n')" = "24.11.0"
          node -e 'const p=require("./package.json"); if(p.packageManager!=="pnpm@10.15.4") process.exit(1); if(p.engines?.node!==">=22 <25") process.exit(1)'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Repository hygiene
        run: node scripts/sanitize-repo.mjs

      - name: Security scan
        run: pnpm security:scan

      - name: Capability contract
        run: pnpm capabilities

      - name: Route contract
        run: pnpm audit:routes

      - name: Migration verification
        run: pnpm db:verify

      - name: Production integrity gate
        run: pnpm production:integrity

      - name: Production preflight
        run: pnpm production:preflight -- --json

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Validate Vercel/Nitro output
        run: |
          test -f .vercel/output/config.json || test -d .output || test -d dist

      - name: Runtime smoke (opt-in)
        if: vars.RUNTIME_SMOKE_URL != ''
        env:
          RUNTIME_SMOKE_URL: ${{ vars.RUNTIME_SMOKE_URL }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            "$RUNTIME_SMOKE_URL/api/health/ready"

      - name: Build evidence
        run: |
          if test -d .vercel/output; then ROOT=.vercel/output;
          elif test -d .output; then ROOT=.output;
          else ROOT=dist; fi
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > build-sha256.txt

      - name: Generate evidence bundle
        run: pnpm production:evidence

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isabella-build-${{ github.sha }}
          path: |
            build-sha256.txt
            release/
          retention-days: 30
