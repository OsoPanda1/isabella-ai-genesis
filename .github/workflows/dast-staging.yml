name: DAST — staging

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"
  workflow_run:
    workflows: ["Isabella Genesis — Security Gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  zap-baseline:
    if: ${{ vars.STAGING_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@4a8b8f4f0a0c4d0a4f5e6b5c4e8f0d5e2c1b9a7f
        with:
          target: ${{ vars.STAGING_URL }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-staging-${{ github.run_id }}
