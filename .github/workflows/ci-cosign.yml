name: CI — Cosign OIDC Signing & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/isabella-core
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"

defaults:
  run:
    shell: bash
    timeout-minutes: 45

jobs:
  build:
    name: Build, test, SBOM and OCI image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify canonical toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonical quality gate
        run: |
          pnpm verify:lock
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm security:scan
          pnpm capabilities
          pnpm audit:routes
          pnpm db:verify
          pnpm production:integrity
          pnpm production:preflight -- --json
          NODE_ENV=production pnpm build

      - name: Generate SBOM
        run: pnpm sbom

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image metadata
        id: meta
        run: echo "image_ref=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Upload SBOM and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-cosign-evidence-${{ github.sha }}
          path: |
            sbom.json
            release/
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Keyless sign OCI image and SBOM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download evidence
        uses: actions/download-artifact@v4
        with:
          name: ci-cosign-evidence-${{ github.sha }}
          path: ./evidence

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign OCI image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Sign SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          test -s evidence/sbom.json
          cosign sign-blob --yes --output-signature evidence/sbom.json.sig evidence/sbom.json

      - name: Upload SBOM signature
        uses: actions/upload-artifact@v4
        with:
          name: ci-cosign-signatures-${{ github.sha }}
          path: evidence/sbom.json.sig
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify keyless signatures
    runs-on: ubuntu-latest
    needs: sign
    permissions:
      contents: read
    steps:
      - name: Download signed evidence
        uses: actions/download-artifact@v4
        with:
          name: ci-cosign-evidence-${{ github.sha }}
          path: ./evidence

      - name: Download SBOM signature
        uses: actions/download-artifact@v4
        with:
          name: ci-cosign-signatures-${{ github.sha }}
          path: ./evidence

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify OCI image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign verify "${IMAGE_NAME}:sha-${GITHUB_SHA}"             --certificate-oidc-issuer-regexp '^https://token\.actions\.githubusercontent\.com$'             --certificate-identity-regexp '^https://github\.com/OsoPanda1/isabella-ai-tina/.github/workflows/ci-cosign\.yml@.*$'

      - name: Verify SBOM signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          test -s evidence/sbom.json
          test -s evidence/sbom.json.sig
          cosign verify-blob evidence/sbom.json             --signature evidence/sbom.json.sig             --certificate-oidc-issuer-regexp '^https://token\.actions\.githubusercontent\.com$'             --certificate-identity-regexp '^https://github\.com/OsoPanda1/isabella-ai-tina/.github/workflows/ci-cosign\.yml@.*$'
