name: CI — Cosign OIDC Signing & Verification (SBOM + OCI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/isabella-core
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"

defaults:
  run:
    shell: bash
    timeout-minutes: 45

jobs:
  build:
    name: Build, SBOM and OCI image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify code
        run: |
          pnpm lint
          pnpm test
          NODE_ENV=production pnpm build

      - name: Generate SBOM
        run: pnpm sbom

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image reference
        id: meta
        run: echo "image_ref=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Upload SBOM and provenance seed
        uses: actions/upload-artifact@v4
        with:
          name: oci-supply-chain-${{ github.sha }}
          path: |
            sbom.json
          if-no-files-found: error
          retention-days: 30

  sign-and-attach:
    name: Sign image and attach SBOM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: oci-supply-chain-${{ github.sha }}
          path: ./supply-chain

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign OCI image
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
        run: cosign sign --yes "$IMAGE"

      - name: Attach SBOM to OCI image
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
        run: cosign attach sbom --sbom ./supply-chain/sbom.json "$IMAGE"

      - name: Sign SBOM
        run: cosign sign-blob --yes --output-signature ./supply-chain/sbom.json.sig ./supply-chain/sbom.json

      - name: Verify image
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
        run: cosign verify "$IMAGE" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*@refs/.*$"

      - name: Verify SBOM signature
        run: cosign verify-blob --signature ./supply-chain/sbom.json.sig ./supply-chain/sbom.json

      - name: Upload signed supply-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: signed-oci-evidence-${{ github.sha }}
          path: |
            supply-chain/sbom.json
            supply-chain/sbom.json.sig
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Registry vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
