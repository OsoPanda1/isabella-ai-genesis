name: Supabase Integrity & Migrations

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/**'

jobs:
  supabase_verify:
    name: Validate Schema & Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      - name: Start Local Supabase Verification Container
        run: supabase start

      - name: Validate Schema and Lint SQL Migrations
        run: supabase db lint

      - name: Run Schema Database Assertions
        run: supabase db test
