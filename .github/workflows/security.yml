name: Security Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # cada lunes

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  # ============================================================
  # JOB 1: Security Audit & Build
  # ============================================================
  security_audit:
    name: Security Scan & Audit Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production Build
        run: pnpm run build:production

      - name: Security Linter Scan
        run: pnpm run security:scan

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high

      - name: Scan for Secret Leaks (Trufflehog)
        uses: trufflesecurity/trufflehog@363923baa4c0e9d6d5ebbf11bd13c9e6bb1e723d
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Generate SBOM (CycloneDX)
        run: pnpm exec cyclonedx-bom -o sbom.json

      - name: Sign SBOM with Cosign
        run: cosign sign-blob --key ${{ secrets.COSIGN_KEY }} sbom.json > sbom.sig

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-signed
          path: |
            sbom.json
            sbom.sig
          retention-days: 30

  # ============================================================
  # JOB 2: CodeQL Static Analysis
  # ============================================================
  codeql_analysis:
    name: CodeQL Static Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml

      - name: Install Dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ============================================================
  # JOB 3: Triple Boost Security Engines
  # ============================================================
  triple_boost:
    name: CodeGuru + Sauce Security + ActionOlympix
    runs-on: ubuntu-latest
    needs: [security_audit, codeql_analysis]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run CodeGuru Reviewer
        uses: aws-actions/codeguru-reviewer@v1
        with:
          build_path: .
          s3_bucket: ${{ secrets.CODEGURU_BUCKET }}

      - name: Run Sauce Security Scan
        uses: saucelabs/sauce-security-action@v1
        with:
          api_key: ${{ secrets.SAUCE_SECURITY_KEY }}

      - name: Run ActionOlympix Security
        uses: actionolympix/security-action@v1
        with:
          token: ${{ secrets.ACTIONOLYMPIX_TOKEN }}

  # ============================================================
  # JOB 4: Isabella Security Interconnection
  # ============================================================
  isabella_bridge:
    name: Push Security Reports to Isabella Systems
    runs-on: ubuntu-latest
    needs: [triple_boost]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Security Reports to Isabella
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.ISABELLA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @sbom.json \
            https://isabella-ai-genesis.vercel.app/api/security/sbom

          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.ISABELLA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @trivy-results.sarif \
            https://isabella-ai-genesis.vercel.app/api/security/trivy

          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.ISABELLA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @sbom.sig \
            https://isabella-ai-genesis.vercel.app/api/security/signatures
