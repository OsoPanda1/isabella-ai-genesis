name: Production Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"

jobs:
  canonical-gate:
    name: Canonical FGAIS gate
    uses: ./.github/workflows/fgais-gate.yml
    permissions:
      contents: read

  dependency-security:
    name: Dependency and secret security
    runs-on: ubuntu-latest
    needs: canonical-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository secret/security gate
        run: pnpm security:scan

      - name: High/critical dependency gate
        run: pnpm audit --audit-level=high

      - name: Generate SBOM
        run: pnpm sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: production-sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  deployment-contract:
    name: Production deployment contract
    runs-on: ubuntu-latest
    needs: canonical-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production workflow has no synthetic deployment
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-production.yml
          ! grep -RniE 'placeholder|no-op|continue-on-error: true|\|\| true'             .github/workflows/deploy-production.yml             .github/workflows/fgais-gate.yml
          test "$(node -p "require('./package.json').engines.node")" = "24.x"

      - name: Validate Vercel contract
        run: |
          node -e '
            const v=require("./vercel.json");
            if (v.installCommand !== "pnpm install --frozen-lockfile") process.exit(1);
            if (v.buildCommand !== "pnpm run build") process.exit(1);
          '
