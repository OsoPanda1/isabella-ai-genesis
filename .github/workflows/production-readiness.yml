name: Production Readiness

on:
  push:
    branches: [main, master, "release/*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"

jobs:
  canonical-gate:
    name: Canonical FGAIS gate
    uses: ./.github/workflows/fgais-gate.yml
    permissions:
      contents: read

  dependency-security:
    name: Dependency and secret security
    runs-on: ubuntu-latest
    needs: canonical-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify package manager and lockfile
        run: |
          node --version
          pnpm --version
          if [ ! -f pnpm-lock.yaml ]; then
            echo "Missing pnpm-lock.yaml" >&2
            exit 1
          fi

      - name: Install clean dependencies (immutable)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Strict typecheck (tsc --noEmit)
        run: pnpm run lint

      - name: Run tests (CI mode)
        run: pnpm test -- --ci --coverage

      - name: Production build (deterministic)
        run: |
          NODE_ENV=production pnpm run build
        env:
          ISABELLA_AUTH_SECRET: ${{ secrets.ISABELLA_AUTH_SECRET }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Dependency audit (high severity)
        run: pnpm audit --audit-level=high || true

      - name: Generate CycloneDX SBOM (cdxgen)
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx @cyclonedx/cdxgen -o sbom.cdx.json || true
          fi

      - name: Sign SBOM (cosign attestation placeholder)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "SBOM signing placeholder - integrate cosign/sigstore for production"

      - name: Upload build artifacts & SBOM
        uses: actions/upload-artifact@v4
        with:
          name: node-production-artifacts
          path: |
            .next/
            dist/
            sbom.cdx.json
          retention-days: 7

  # =========================================================================
  # JOB 4: Container Build, Scan, and Image Signing (Trivy + Cosign OIDC)
  # =========================================================================
  container-build:
    name: Container Build, Trivy & Sign
    runs-on: ubuntu-latest
    needs: [node-app, rust-core]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build & push OCI image (BuildKit + cache)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (image)
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"

      - name: Sign OCI image with cosign (OIDC)
        id: cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "Signing image with cosign via OIDC (placeholder). In production, use: cosign sign --key <kms-or-oidc> ${{ steps.meta.outputs.tags }}"

      - name: Generate image provenance attestation (SLSA-like)
        run: |
          echo "Generating provenance attestation (placeholder). Use in-toto/slsa-tooling in production."

  # =========================================================================
  # JOB 5: IaC & SAST Scans (Checkov, KubeLinter)
  # =========================================================================
  iac-scan:
    name: IaC & SAST Scans
    runs-on: ubuntu-latest
    needs: [container-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkov (Terraform / IaC)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,cloudformation,kubernetes

      - name: KubeLinter (Kubernetes manifests)
        uses: stackrox/kube-linter-action@v0.2.0
        with:
          args: ./k8s || true

      - name: Repository secret/security gate
        run: pnpm security:scan

      - name: High/critical dependency gate
        run: pnpm audit --audit-level=high

      - name: Generate SBOM
        run: pnpm sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: production-sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  deployment-contract:
    name: Production deployment contract
    runs-on: ubuntu-latest
    needs: canonical-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          version: "v1.30.0"

      - name: Apply Node Zero Kubeconfig Context
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_NODE_ZERO }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Extract image tag
        id: meta
        run: echo "IMAGE_TAG=sha-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Validate production workflow has no synthetic deployment
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-production.yml
          ! grep -RniE 'placeholder|no-op|continue-on-error: true|\|\| true'             .github/workflows/deploy-production.yml             .github/workflows/fgais-gate.yml
          test "$(node -p "require('./package.json').engines.node")" = "24.x"

      - name: Validate Vercel contract
        run: |
          node -e '
            const v=require("./vercel.json");
            if (v.installCommand !== "pnpm install --frozen-lockfile") process.exit(1);
            if (v.buildCommand !== "pnpm run build") process.exit(1);
          '
