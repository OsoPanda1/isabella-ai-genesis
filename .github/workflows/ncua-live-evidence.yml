name: Isabella Genesis — Live NCUA Evidence

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed Isabella base URL"
        required: true
        type: string
      stages:
        description: "Comma-separated concurrency stages"
        required: false
        default: "50,100,250,500"
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.15.4"

jobs:
  live-ncua:
    name: Live NCUA 50→500 evidence
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Run live NCUA evidence
        env:
          NCUA_LIVE_BASE_URL: ${{ inputs.base_url }}
          NCUA_AUTHORIZATION: ${{ secrets.NCUA_AUTHORIZATION }}
          NCUA_STAGES: ${{ inputs.stages }}
        run: node scripts/ncua-live-load.mjs | tee ncua-live-evidence.jsonl

      - name: Upload NCUA evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ncua-live-evidence-${{ github.run_id }}
          path: ncua-live-evidence.jsonl
          retention-days: 30
          if-no-files-found: error
