name: Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"
  VERCEL_CLI_VERSION: "59.20.0"

jobs:
  quality:
    name: Canonical production gate
    uses: ./.github/workflows/fgais-gate.yml
    permissions:
      contents: read

  migrate:
    name: Production DB migration + verification
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ISABELLA_STORAGE_PROVIDER: ${{ secrets.ISABELLA_STORAGE_PROVIDER }}
      NODE_ENV: production
      ISABELLA_RUNTIME_MODE: production
      AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
      BOOKPI_SIGNING_KEY: ${{ secrets.BOOKPI_SIGNING_KEY }}
      AEGIS_AUDIT_SECRET: ${{ secrets.AEGIS_AUDIT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:verify

  ncua-live:
    name: NCUA 50-500 live certification
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      NCUA_LIVE_BASE_URL: ${{ secrets.NCUA_LIVE_BASE_URL }}
      NCUA_AUTHORIZATION: ${{ secrets.NCUA_AUTHORIZATION }}
      NCUA_STAGES: "50,100,250,500"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/ncua-live-load.mjs

  deploy:
    name: Vercel production deploy
    needs: [quality, migrate, ncua-live]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}
      - name: Verify Vercel CLI
        run: vercel --version
      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    name: Production runtime smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify deployed URL
        env:
          PRODUCTION_SMOKE_URL: ${{ needs.deploy.outputs.url }}
        run: node scripts/production-smoke.mjs
      - name: Emit deployment evidence
        env:
          PRODUCTION_URL: ${{ needs.deploy.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";
          mkdirSync("release", { recursive: true });
          writeFileSync("release/deployment.json", JSON.stringify({
            schema: "isabella.production-release.v1",
            status: "PASS",
            commit: process.env.GITHUB_SHA,
            productionUrl: process.env.PRODUCTION_URL,
            smoke: "PASS",
            completedAt: new Date().toISOString()
          }, null, 2) + "\n");
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isabella-production-release-${{ github.sha }}
          path: release/deployment.json
          retention-days: 30
