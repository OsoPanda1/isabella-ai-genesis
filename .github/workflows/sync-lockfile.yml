name: Sync pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

concurrency:
  group: sync-pnpm-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.head_commit.message != 'chore: sync pnpm lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify frozen lockfile before commit
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name 'TAMV ONLINE ENTERPRISE'
          git config user.email '120252809+OsoPanda1@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git commit -m 'chore: sync pnpm lockfile'
          git push
