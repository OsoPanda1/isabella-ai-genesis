name: Install Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: pnpm
      - name: Frozen install diagnostic
        run: |
          set +e
          pnpm install --frozen-lockfile --reporter=append-only > install.log 2>&1
          code=$?
          cat install.log
          echo "INSTALL_EXIT=$code" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-diagnostic-${{ github.sha }}
          path: install.log
