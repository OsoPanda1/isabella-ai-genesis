name: Repair and verify pnpm lockfile

on:
  push:
    branches:
      - repair/production-certification-2026-09-21
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-lockfile
  cancel-in-progress: true

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.15.4"

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate manifest and regenerate lockfile
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile deterministically"
          git push origin HEAD:${GITHUB_REF_NAME}

  report:
    needs: regenerate
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Report
        run: |
          echo "Lockfile regeneration job result: ${{ needs.regenerate.result }}"
