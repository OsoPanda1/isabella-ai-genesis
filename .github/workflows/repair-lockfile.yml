name: Repair committed pnpm lockfile

# Bootstrap workflow: synchronize the committed lockfile once; subsequent bot pushes do not retrigger it.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-lockfile
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0

      - name: Setup pnpm 10.15.0
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.15.0
          run_install: false

      - name: Validate toolchain
        run: |
          node --version
          pnpm --version

      - name: Regenerate lockfile from package.json
        run: pnpm install --lockfile-only

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): synchronize pnpm lockfile"
          git push
