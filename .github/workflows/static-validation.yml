name: Static Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

jobs:
  validate:
    name: Validate / Build / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm run test

      - name: Capability gate
        run: pnpm run capabilities

      - name: Migration verification
        run: node scripts/db-verify.mjs

      - name: Production build
        run: pnpm run build

      - name: Validate build artifact
        run: |
          test -d .output || test -d dist
          if test -d .output; then
            find .output -type f -print0 | sort -z | xargs -0 sha256sum > build-sha256.txt
          else
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > build-sha256.txt
          fi

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: isabella-build-${{ github.sha }}
          path: build-sha256.txt
          retention-days: 30
