name: Isabella Genesis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  # ============================================================
  # JOB 1: Environment Validation
  # ============================================================
  env-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate env vars presence (strict on push, warn-only on PRs)
        # Conjunto canónico = requiredEnvKeys("production") de src/lib/env-schema.ts
        # (menos NODE_ENV, que tiene default). Verificado por test/unit/ci-env-parity.test.ts.
        # CI == Production Readiness: ni más (APP_URL) ni menos (CROWN/AEGIS/BookPI/Stripe).
        run: |
          MISSING=()
          for VAR in PUBLIC_URL SUPABASE_URL SUPABASE_ANON_KEY AUTH_JWT_SECRET GEMINI_API_KEY ENCRYPTION_MASTER_KEY CROWN_POLICY_SIGNING_KEY AEGIS_AUDIT_SECRET BOOKPI_SIGNING_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            if [ -z "${!VAR}" ]; then
              echo "⚠️ Missing $VAR"
              MISSING+=("$VAR")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::env-check: missing secrets in PR context (${MISSING[*]}). Skipping strict gate; runtime validation stays fail-fast via src/lib/env-schema.ts."
              exit 0
            else
              echo "❌ Missing required secrets: ${MISSING[*]}"
              exit 1
            fi
          fi
          echo "✅ All required secrets present."
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
          CROWN_POLICY_SIGNING_KEY: ${{ secrets.CROWN_POLICY_SIGNING_KEY }}
          AEGIS_AUDIT_SECRET: ${{ secrets.AEGIS_AUDIT_SECRET }}
          BOOKPI_SIGNING_KEY: ${{ secrets.BOOKPI_SIGNING_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

  # ============================================================
  # JOB 2: Build & Tests
  # ============================================================
  build:
    runs-on: ubuntu-latest
    needs: env-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm run lint && pnpm run typecheck
      - run: pnpm run capabilities
      - run: pnpm run test --if-present
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .output/

  # ============================================================
  # JOB 3: Security & Supply Chain
  # ============================================================
  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Audit dependencies (high and above)
        run: pnpm audit --audit-level=high
      - name: Scan for secret leaks (Trufflehog, filesystem only)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
      - name: Trivy filesystem scan (CRITICAL,HIGH -> SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: trivy-results.sarif
          retention-days: 14

  # ============================================================
  # JOB 4: SAST (CodeQL)
  # ============================================================
  codeql:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - uses: github/codeql-action/analyze@v4

  # ============================================================
  # JOB 5: Migration Verification (real, estática sin DB)
  # ============================================================
  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify migrations structure
        run: node scripts/db-verify.mjs
      - name: Warn if pnpm-lock.yaml missing (builds no deterministas)
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::warning::Falta pnpm-lock.yaml. Generar con pnpm@10 (canónico): pnpm import package-lock.json && pnpm install --lockfile-only"
          fi

  # ============================================================
  # JOB 6: Release Readiness (nombre honesto: NO es staging deploy,
  # smoke test, payment test ni load test — ver release.yml y runbook)
  # ============================================================
  release-readiness:
    runs-on: ubuntu-latest
    needs: [build, security, codeql, migrate-check]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: security-artifacts
          path: ./reports
      - run: |
          sha256sum ./reports/trivy-results.sarif > ./reports/trivy-results.checksum
          echo "✅ Static gates passed (build, security, codeql, migrations)."
          echo "⚠️ NOT covered here: staging deploy, smoke test, payment test, rollback, load test."
