name: Isabella Genesis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  # ============================================================
  # JOB 1: Environment Validation
  # ============================================================
  env-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate env vars presence
        run: |
          for VAR in APP_URL PUBLIC_URL SUPABASE_URL SUPABASE_ANON_KEY AUTH_JWT_SECRET SUPABASE_JWT_SECRET GEMINI_API_KEY ENCRYPTION_MASTER_KEY; do
            if [ -z "${!VAR}" ]; then
              echo "❌ Missing $VAR"
              exit 1
            fi
          done
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}

  # ============================================================
  # JOB 2: Build & Tests
  # ============================================================
  build:
    runs-on: ubuntu-latest
    needs: env-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint && pnpm run typecheck
      - run: pnpm run test --if-present
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .next/

  # ============================================================
  # JOB 3: Security & Supply Chain
  # ============================================================
  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: pnpm audit --audit-level=high
      - uses: trufflesecurity/trufflehog@latest
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      - run: pnpm exec cyclonedx-bom -o sbom.json
      - run: cosign sign-blob --key ${{ secrets.COSIGN_KEY }} sbom.json > sbom.sig
      - uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            sbom.json
            sbom.sig

  # ============================================================
  # JOB 4: SAST (CodeQL)
  # ============================================================
  codeql:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/analyze@v3

  # ============================================================
  # JOB 5: Release Gate
  # ============================================================
  release-gate:
    runs-on: ubuntu-latest
    needs: [build, security, codeql]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: security-artifacts
          path: ./reports
      - run: |
          sha256sum ./reports/sbom.json > ./reports/sbom.checksum
          echo "✅ All gates passed. Ready for release."
