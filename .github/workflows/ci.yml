name: Isabella Genesis CI/CD

on:
  push:
    branches: [main, master, "release/*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  # ============================================================
  # JOB 1: Environment Validation
  # ============================================================
  env-check:
    name: Validate Environment Variables
    runs-on: ubuntu-latest
    steps:
      - name: Check required env vars
        run: |
          REQUIRED_VARS=(APP_URL PUBLIC_URL SUPABASE_URL SUPABASE_ANON_KEY AUTH_JWT_SECRET SUPABASE_JWT_SECRET GEMINI_API_KEY ENCRYPTION_MASTER_KEY)
          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR}" ]; then
              echo "❌ Missing $VAR"
              exit 1
            fi
          done

  # ============================================================
  # JOB 2: Node.js Setup & Build
  # ============================================================
  build:
    name: Node.js Build & Test
    runs-on: ubuntu-latest
    needs: env-check
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        run: pnpm run lint && pnpm run typecheck

      - name: Run Tests
        run: pnpm run test --if-present

      - name: Build Project
        run: pnpm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .next/
          retention-days: 7

  # ============================================================
  # JOB 3: Security Sanitizer & SAST
  # ============================================================
  security-scan:
    name: Security Scan (Trivy + Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # JOB 4: StackQL Validation
  # ============================================================
  stackql:
    name: StackQL Policy Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install StackQL
        run: |
          curl -s https://stackql.io/install.sh | bash
      - name: Run StackQL Policies
        run: stackql exec --file .stackql/policies.sql

  # ============================================================
  # JOB 5: Close Stale Issues
  # ============================================================
  stale:
    name: Close Stale Issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "⚠️ Este issue está inactivo. Se cerrará automáticamente si no hay actividad."
          days-before-stale: 30
          days-before-close: 7
