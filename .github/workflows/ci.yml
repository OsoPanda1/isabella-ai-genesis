name: Isabella Genesis CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate env vars presence
        run: |
          REQUIRED_VARS=(APP_URL PUBLIC_URL SUPABASE_URL SUPABASE_ANON_KEY AUTH_JWT_SECRET SUPABASE_JWT_SECRET GEMINI_API_KEY ENCRYPTION_MASTER_KEY)
          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR}" ]; then
              echo "❌ Missing $VAR"
              exit 1
            fi
          done
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}

  build:
    runs-on: ubuntu-latest
    needs: env-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint && pnpm run typecheck
      - run: pnpm run test --if-present
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .next/

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: pnpm audit --audit-level=high
      - uses: trufflesecurity/trufflehog@latest
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      - run: pnpm exec cyclonedx-bom -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  release-gate:
    runs-on: ubuntu-latest
    needs: [build, security]
    steps:
      - run: echo "✅ All gates passed. Ready for release."
