name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
      - "repair/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gate:
    name: Canonical FGAIS gate
    uses: ./.github/workflows/fgais-gate.yml
    permissions:
      contents: read
