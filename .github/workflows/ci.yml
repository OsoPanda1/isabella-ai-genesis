name: Isabella Genesis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  # ============================================================
  # JOB 1: Environment Validation
  # ============================================================
  env-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate env vars presence (strict on push, warn-only on PRs)
        run: |
          MISSING=()
          for VAR in APP_URL PUBLIC_URL SUPABASE_URL SUPABASE_ANON_KEY AUTH_JWT_SECRET SUPABASE_JWT_SECRET GEMINI_API_KEY ENCRYPTION_MASTER_KEY; do
            if [ -z "${!VAR}" ]; then
              echo "⚠️ Missing $VAR"
              MISSING+=("$VAR")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::env-check: missing secrets in PR context (${MISSING[*]}). Skipping strict gate; runtime validation stays fail-fast via src/lib/env-schema.ts."
              exit 0
            else
              echo "❌ Missing required secrets: ${MISSING[*]}"
              exit 1
            fi
          fi
          echo "✅ All required secrets present."
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}

  # ============================================================
  # JOB 2: Build & Tests
  # ============================================================
  build:
    runs-on: ubuntu-latest
    needs: env-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm run lint && pnpm run typecheck
      - run: pnpm run test --if-present
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .output/

  # ============================================================
  # JOB 3: Security & Supply Chain
  # ============================================================
  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Audit dependencies (high and above)
        run: pnpm audit --audit-level=high
      - name: Scan for secret leaks (Trufflehog, filesystem only)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
      - name: Trivy filesystem scan (CRITICAL,HIGH -> SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: trivy-results.sarif
          retention-days: 14

  # ============================================================
  # JOB 4: SAST (CodeQL)
  # ============================================================
  codeql:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - uses: github/codeql-action/analyze@v4

  # ============================================================
  # JOB 5: Release Gate
  # ============================================================
  release-gate:
    runs-on: ubuntu-latest
    needs: [build, security, codeql]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: security-artifacts
          path: ./reports
      - run: |
          sha256sum ./reports/trivy-results.sarif > ./reports/trivy-results.checksum
          echo "✅ All gates passed. Ready for release."
