Integración con Ecosistema CI/CD
Workflow	Propósito	Trigger	Dependencias
ci.yml	Validación continua	push/PR a main	Ninguna
release.yml	Publicar release	tag v*	ci.yml (ya pasó en main)
deploy-prod.yml	Deploy manual a prod	workflow_dispatch	release.yml (artifacts)
smoke-tests.yml	Tests post-deploy	workflow_dispatch	deploy-prod.yml
