name: Release Compiler & Artifact Deployment

on:
  push:
    tags:
      - 'v*'

jobs:
  release_build:
    name: Build & Package Production Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 'latest'

      - name: Install Dependencies
        run: bun install --frozen-lockfile || npm ci

      - name: Compile and Bundle Production Build
        run: npm run build

      - name: Create Production Release Bundle
        run: |
          tar -czf isabella-cognitive-gateway-${{ github.ref_name }}.tar.gz dist/ package.json

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            isabella-cognitive-gateway-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
