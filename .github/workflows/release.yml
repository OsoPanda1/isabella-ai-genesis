name: Production Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.16.0"
  PNPM_VERSION: "10.15.0"
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  env-check:
    name: Validate production contract
    runs-on: ubuntu-22.04
    steps:
      - name: Validate required production variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          ISABELLA_STORAGE_PROVIDER: ${{ secrets.ISABELLA_STORAGE_PROVIDER }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
          CROWN_POLICY_SIGNING_KEY: ${{ secrets.CROWN_POLICY_SIGNING_KEY }}
          AEGIS_AUDIT_SECRET: ${{ secrets.AEGIS_AUDIT_SECRET }}
          BOOKPI_SIGNING_KEY: ${{ secrets.BOOKPI_SIGNING_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVISION_OWNER_TOKEN: ${{ secrets.PROVISION_OWNER_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          REQUIRED_VARS=(
            DATABASE_URL
            PUBLIC_URL
            ISABELLA_STORAGE_PROVIDER
            AUTH_JWT_SECRET
            ENCRYPTION_MASTER_KEY
            CROWN_POLICY_SIGNING_KEY
            AEGIS_AUDIT_SECRET
            BOOKPI_SIGNING_KEY
            GEMINI_API_KEY
            PROVISION_OWNER_TOKEN
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
          )
          missing=0
          for name in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing production secret/variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Production environment contract satisfied: ${#REQUIRED_VARS[@]} variables present."

  verify:
    name: Re-run canonical production gate
    needs: env-check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Build and publish release
    needs: [env-check, verify]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Validate Nitro output
        run: |
          set -euo pipefail
          test -d .output
          test -f .output/server/index.mjs
          find .output -type f -print0 | sort -z | xargs -0 sha256sum > release-sha256.txt

      - name: Package immutable release artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -czf "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz" .output package.json pnpm-lock.yaml
          sha256sum "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz" > "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz.sha256"
          cp release-sha256.txt "artifacts/release-output-sha256.txt"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
