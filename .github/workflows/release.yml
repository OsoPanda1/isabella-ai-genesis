name: Release Compiler & Artifact Deployment

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write
  security-events: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Environment Validation
  # ============================================================
  env-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required env vars (strict for release tags)
        run: |
          MISSING=()
          REQUIRED_VARS=(APP_URL PUBLIC_URL SUPABASE_URL SUPABASE_ANON_KEY AUTH_JWT_SECRET SUPABASE_JWT_SECRET GEMINI_API_KEY ENCRYPTION_MASTER_KEY)
          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR}" ]; then
              echo "❌ Missing $VAR"
              MISSING+=("$VAR")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Release blocked, missing secrets: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All release secrets present."
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}

  # ============================================================
  # JOB 2: Build & Package Release
  # ============================================================
  release_build:
    runs-on: ubuntu-latest
    needs: env-check
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Lint & Typecheck
        run: pnpm run lint && pnpm run typecheck

      - name: Run Tests
        run: pnpm run test --if-present

      - name: Build Project
        run: pnpm run build

      - name: Create Release Bundle
        run: |
          mkdir -p artifacts
          if [ -d ".output" ]; then
            tar -czf artifacts/isabella-gateway-${{ github.ref_name }}.tar.gz .output/ dist/ package.json
          else
            tar -czf artifacts/isabella-gateway-${{ github.ref_name }}.tar.gz dist/ package.json
          fi
          sha256sum artifacts/isabella-gateway-${{ github.ref_name }}.tar.gz > artifacts/isabella-gateway-${{ github.ref_name }}.tar.gz.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 3: Security Scans
  # ============================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: release_build
    steps:
      - uses: actions/checkout@v4

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # JOB 4: StackQL Policy Enforcement (optional, only if policies exist)
  # ============================================================
  stackql:
    runs-on: ubuntu-latest
    needs: release_build
    steps:
      - uses: actions/checkout@v4
      - name: Run StackQL Policies (skip if no policies file)
        run: |
          if [ ! -f .stackql/policies.sql ]; then
            echo "::notice::No .stackql/policies.sql found, skipping StackQL gate."
            exit 0
          fi
          curl -s https://stackql.io/install.sh | bash
          stackql exec --file .stackql/policies.sql

  # ============================================================
  # JOB 5: Close Stale Issues
  # ============================================================
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "⚠️ Este issue está inactivo. Se cerrará automáticamente si no hay actividad."
          days-before-stale: 30
          days-before-close: 7
