└──────────┬──────────────┘
           │
           ├──────────────────────┬──────────────────────┬──────────────┐
           ▼                      ▼                      ▼              ▼
    ┌─────────────┐       ┌─────────────┐       ┌─────────────┐ ┌─────────────┐
    │ 3. security │       │ 4. stackql  │       │ 5. stale    │ │ 6. post-    │
    │    scan     │       │ (optional)  │       │ (cleanup)   │ │    release  │
    │    🛡️       │       │    📋       │       │    🧹       │ │    📢       │
