name: Release Compiler & Artifact Deployment

on:
  push:
    tags:
      - "v*"

jobs:
  release_build:
    name: Build & Package Production Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install

      - name: Compile and Bundle Production Build
        run: npm run build

      - name: Create Production Release Bundle
        run: |
          if [ -d ".output" ]; then
            tar -czf isabella-cognitive-gateway-${{ github.ref_name }}.tar.gz .output/ dist/ package.json
          else
            tar -czf isabella-cognitive-gateway-${{ github.ref_name }}.tar.gz dist/ package.json
          fi

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            isabella-cognitive-gateway-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
