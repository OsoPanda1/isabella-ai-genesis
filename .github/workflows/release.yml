# .github/workflows/release.yml
# ════════════════════════════════════════════════════════════════════════════
# Isabella Genesis — Production Release Pipeline
# ════════════════════════════════════════════════════════════════════════════
# Version: 2026.9.1-enterprise
# 
# PROPÓSITO:
#   Pipeline de release para producción con validación estricta de seguridad,
#   generación de artefactos verificables, y notificación automatizada.
# 
# TRIGGER:
#   - Push de tags semánticos: v*, v*-rc* (release candidates)
# 
# CARACTERÍSTICAS:
#   ✅ Validación estricta de secrets (11 variables canónicas)
#   ✅ Build determinista (pnpm frozen-lockfile)
#   ✅ Artefactos con checksum SHA256 verificable
#   ✅ Release notes auto-generadas desde CHANGELOG.md
#   ✅ Security scans no-bloqueantes (Gitleaks + Trivy → GitHub Security)
#   ✅ Policy enforcement opcional (StackQL)
#   ✅ Notificación multi-canal (GitHub + Discord)
#   ✅ Cleanup automático de issues/PRs stale
#   ✅ Trazabilidad completa (commit → tag → release → artifacts)
# 
# SEGURIDAD:
#   - Secrets inyectados solo en env-check (aislado)
#   - Trivy scan post-release (reporte, no bloqueo)
#   - Gitleaks verifica commits históricos
#   - Artifacts con retención de 30 días (auditoría)
# 
# INTEGRACIÓN:
#   - Depende de: ci.yml (build, security, codeql ya pasaron en main)
#   - Genera: GitHub Release + artifacts descargables
#   - Notifica: Discord webhook (opcional)
#   - Reporta: GitHub Security tab (Trivy SARIF)
# 
# DOCUMENTACIÓN RELACIONADA:
#   - CI Pipeline: .github/workflows/ci.yml
#   - Deploy Prod: .github/workflows/deploy-prod.yml
#   - Runbook: runbook/release.md, runbook/rollback.md
#   - Changelog: CHANGELOG.md (convención: Keep a Changelog)
# ════════════════════════════════════════════════════════════════════════════

name: 🚀 Production Release Pipeline

on:
  push:
    tags:
      - "v*"  # Semantic versioning: v1.0.0, v2.1.3, etc.
      - "v*-rc*"  # Release candidates: v1.0.0-rc.1

# Permissions mínimas (principle of least privilege)
permissions:
  contents: write  # Create releases, upload artifacts
  security-events: write  # Upload SARIF to GitHub Security
  packages: write  # Publish to GitHub Packages (future)
  issues: write  # Close stale issues
  pull-requests: write  # Comment on stale PRs

# Concurrency: no cancelar releases una vez iniciadas (integridad del proceso)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Versiones canónicas (source of truth: package.json engines)
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  
  # Metadata del release
  RELEASE_TAG: ${{ github.ref_name }}
  REPOSITORY: ${{ github.repository }}

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Environment Validation — Gate de Seguridad Inicial
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Validar que TODOS los secrets requeridos para producción estén presentes.
  #   Esto es CRÍTICO: un release sin secrets completos es inseguro.
  # 
  # SECRETS VALIDADOS (11 variables canónicas):
  #   - PUBLIC_URL: URL pública del gateway
  #   - SUPABASE_URL: Endpoint de Supabase
  #   - SUPABASE_ANON_KEY: Key pública de Supabase
  #   - AUTH_JWT_SECRET: Secreto para JWTs
  #   - GEMINI_API_KEY: API key para IA (Google)
  #   - ENCRYPTION_MASTER_KEY: Key de encriptación maestra
  #   - CROWN_POLICY_SIGNING_KEY: Key para políticas CROWN
  #   - AEGIS_AUDIT_SECRET: Secreto para auditoría AEGIS
  #   - BOOKPI_SIGNING_KEY: Key para webhooks BookPI
  #   - STRIPE_SECRET_KEY: API key de Stripe (producción)
  #   - STRIPE_WEBHOOK_SECRET: Webhook signing secret de Stripe
  # ════════════════════════════════════════════════════════════════════════════
  
  env-check:
    name: 🔐 Validate Production Secrets
    runs-on: ubuntu-latest
    outputs:
      secrets-present: ${{ steps.check.outputs.secrets-present }}
      all-secrets: ${{ steps.check.outputs.all-secrets }}
    steps:
      - name: Validate required env vars (strict for release tags)
        id: check
        run: |
          echo "🔐 Validating production secrets for release ${{ env.RELEASE_TAG }}..."
          echo ""
          
          MISSING=()
          PRESENT=()
          REQUIRED_VARS=(
            DATABASE_URL
            PUBLIC_URL
            SUPABASE_URL
            SUPABASE_ANON_KEY
            AUTH_JWT_SECRET
            GEMINI_API_KEY
            ENCRYPTION_MASTER_KEY
            CROWN_POLICY_SIGNING_KEY
            AEGIS_AUDIT_SECRET
            BOOKPI_SIGNING_KEY
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
          )
          
          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR}" ]; then
              echo "  ❌ Missing: $VAR"
              MISSING+=("$VAR")
            else
              echo "  ✅ Present: $VAR"
              PRESENT+=("$VAR")
            fi
          done
          
          echo ""
          echo "📊 Summary: ${#PRESENT[@]}/${#REQUIRED_VARS[@]} secrets present"
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "❌ Release BLOCKED: Missing ${#MISSING[@]} required secrets:"
            echo "   ${MISSING[*]}"
            echo ""
            echo "🔧 Fix: Add missing secrets in GitHub Settings → Secrets and variables → Actions"
            echo "secrets-present=false" >> $GITHUB_OUTPUT
            echo "all-secrets=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo ""
          echo "✅ All production secrets validated successfully"
          echo "secrets-present=true" >> $GITHUB_OUTPUT
          echo "all-secrets=true" >> $GITHUB_OUTPUT
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
          CROWN_POLICY_SIGNING_KEY: ${{ secrets.CROWN_POLICY_SIGNING_KEY }}
          AEGIS_AUDIT_SECRET: ${{ secrets.AEGIS_AUDIT_SECRET }}
          BOOKPI_SIGNING_KEY: ${{ secrets.BOOKPI_SIGNING_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Build & Package Release — Generación de Artefactos
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Compilar el proyecto, generar artefactos de producción, y publicar
  #   GitHub Release con notas automáticas desde CHANGELOG.md.
  # 
  # ARTEFACTOS GENERADOS:
  #   - isabella-gateway-vX.Y.Z.tar.gz: Bundle de producción
  #   - isabella-gateway-vX.Y.Z.tar.gz.sha256: Checksum de verificación
  # 
  # VALIDACIONES:
  #   - Lint & typecheck (calidad de código)
  #   - Tests unitarios (integridad funcional)
  #   - Build output verification (fail-fast si no genera output)
  #   - Checksum SHA256 (integridad del artefacto)
  # ════════════════════════════════════════════════════════════════════════════
  
  release_build:
    name: 🏗️ Build & Package Release
    runs-on: ubuntu-latest
    needs: env-check
    if: needs.env-check.outputs.secrets-present == 'true'
    outputs:
      release-url: ${{ steps.github-release.outputs.url }}
      artifact-name: ${{ steps.create-bundle.outputs.artifact-name }}
    steps:
      - name: Checkout repository (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm (canónico v10)
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }} (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (deterministic, frozen lockfile)
        run: |
          echo "📦 Installing dependencies with pnpm@${{ env.PNPM_VERSION }}..."
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            echo "✅ Using frozen lockfile (deterministic build)"
          else
            echo "::error::❌ pnpm-lock.yaml missing"
            echo "Release builds MUST be deterministic."
            echo "Fix: Run 'pnpm install --lockfile-only' locally and commit pnpm-lock.yaml"
            exit 1
          fi

      - name: Lint & Typecheck (quality gate)
        run: |
          echo "🔍 Running lint & typecheck..."
          pnpm run lint && pnpm run typecheck
          echo "✅ Code quality validated"

      - name: Run tests (unit + integration)
        run: |
          echo "🧪 Running tests..."
          pnpm run test --if-present
          echo "✅ All tests passed"

      - name: Build production bundle
        run: |
          echo "🏗️ Building production bundle..."
          pnpm run build
          echo "✅ Build completed"

      - name: Validate build output (fail-fast)
        run: |
          echo "🔍 Validating build output..."
          if [ ! -d .output/ ] && [ ! -d dist/ ]; then
            echo "::error::❌ Build output not found"
            echo "Expected: .output/ or dist/"
            echo "Fix: Check 'pnpm run build' script in package.json"
            exit 1
          fi
          
          # Count files in output
          if [ -d .output/ ]; then
            file_count=$(find .output/ -type f | wc -l)
            echo "✅ .output/ validated ($file_count files)"
          else
            file_count=$(find dist/ -type f | wc -l)
            echo "✅ dist/ validated ($file_count files)"
          fi

      - name: Create release bundle (tarball + checksum)
        id: create-bundle
        run: |
          echo "📦 Creating release bundle..."
          mkdir -p artifacts
          
          ARTIFACT_NAME="isabella-gateway-${{ env.RELEASE_TAG }}.tar.gz"
          CHECKSUM_FILE="${ARTIFACT_NAME}.sha256"
          
          if [ -d ".output" ]; then
            echo "   Including: .output/, package.json, pnpm-lock.yaml"
            tar -czf "artifacts/$ARTIFACT_NAME" .output/ package.json pnpm-lock.yaml 2>/dev/null || \
            tar -czf "artifacts/$ARTIFACT_NAME" .output/ package.json
          else
            echo "   Including: dist/, package.json, pnpm-lock.yaml"
            tar -czf "artifacts/$ARTIFACT_NAME" dist/ package.json pnpm-lock.yaml 2>/dev/null || \
            tar -czf "artifacts/$ARTIFACT_NAME" dist/ package.json
          fi
          
          # Generate SHA256 checksum
          sha256sum "artifacts/$ARTIFACT_NAME" > "artifacts/$CHECKSUM_FILE"
          
          # Display checksum
          CHECKSUM=$(cat "artifacts/$CHECKSUM_FILE" | awk '{print $1}')
          echo ""
          echo "📦 Bundle created: $ARTIFACT_NAME"
          echo "🔐 SHA256: $CHECKSUM"
          echo ""
          echo "   To verify after download:"
          echo "   sha256sum -c $CHECKSUM_FILE"
          echo ""
          
          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload build artifacts (retention: 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Generate release notes from CHANGELOG.md
        id: changelog
        run: |
          echo "📝 Generating release notes from CHANGELOG.md..."
          
          if [ -f CHANGELOG.md ]; then
            VERSION="${{ env.RELEASE_TAG }}"
            # Extract section for this version
            # Format: ## [v1.0.0] or ## [1.0.0]
            NOTES=$(awk "
              /^## \[?${VERSION#v}/ { flag=1; next }
              /^## \[/ { flag=0 }
              flag
            " CHANGELOG.md 2>/dev/null || echo "")
            
            if [ -z "$NOTES" ]; then
              echo "⚠️ No changelog entry found for $VERSION"
              NOTES="Release $VERSION"
            fi
          else
            echo "⚠️ CHANGELOG.md not found"
            NOTES="Release $VERSION"
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Release notes generated"

      - name: Determine if prerelease
        id: prerelease-check
        run: |
          if [[ "${{ env.RELEASE_TAG }}" == *"-rc"* ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "🏷️ This is a release candidate (prerelease)"
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            echo "🏷️ This is a stable release"
          fi

      - name: Publish GitHub Release
        id: github-release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ steps.prerelease-check.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          make_latest: ${{ steps.prerelease-check.outputs.is-prerelease == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display release summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "🎉 RELEASE PUBLISHED SUCCESSFULLY"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "📦 Tag: ${{ env.RELEASE_TAG }}"
          echo "🔗 URL: ${{ steps.github-release.outputs.url }}"
          echo "📝 Artifact: ${{ steps.create-bundle.outputs.artifact-name }}"
          echo ""
          echo "═══════════════════════════════════════════════════════"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Security Scans — Reporte Post-Release (Non-Bloqueante)
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Escanear el código en busca de secrets accidentalmente committeados
  #   (Gitleaks) y vulnerabilidades de seguridad (Trivy).
  # 
  # NOTA: Estos scans son POST-RELEASE (no bloquean) porque:
  #   - El release ya fue validado por ci.yml (build, security, codeql)
  #   - Este pipeline es para publicar, no para validar (validación en CI)
  #   - Los resultados se reportan a GitHub Security tab para auditoría
  # 
  # SCANS:
  #   - Gitleaks: Detecta secrets en histórico de commits
  #   - Trivy: Detecta vulnerabilidades en código y dependencias
  # ════════════════════════════════════════════════════════════════════════════
  
  security-scan:
    name: 🛡️ Security Scans (Post-Release)
    runs-on: ubuntu-latest
    needs: release_build
    if: always()  # Ejecutar siempre (incluso si release_build falla)
    continue-on-error: true  # No fallar el pipeline (reporte solamente)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Gitleaks

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional, for higher rate limits
        continue-on-error: true

      - name: Vulnerability scan with Trivy (CRITICAL + HIGH)
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # Don't fail (post-release report)

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
        if: always()

      - name: Display security scan summary
        run: |
          echo ""
          echo "🛡️ Security Scans Completed"
          echo ""
          echo "   Gitleaks: Check 'Security' tab → Secret scanning"
          echo "   Trivy: Check 'Security' tab → Vulnerabilities"
          echo ""
          echo "⚠️ Note: These are post-release scans (non-blocking)"
          echo "   Critical issues should have been caught in ci.yml"
          echo ""

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: StackQL Policy Enforcement — Validación Opcional de Políticas
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Ejecutar políticas de compliance definidas en .stackql/policies.sql.
  #   Esto es OPCIONAL: si no existe el archivo, el job se saltea gracefully.
  # 
  # EJEMPLOS DE POLÍTICAS:
  #   - Verificar que todos los endpoints tengan autenticación
  #   - Validar que no haya endpoints públicos críticos
  #   - Asegurar que ciertos headers estén presentes
  # ════════════════════════════════════════════════════════════════════════════
  
  stackql:
    name: 📋 StackQL Policy Enforcement
    runs-on: ubuntu-latest
    needs: release_build
    if: always()  # Ejecutar siempre (incluso si release_build falla)
    continue-on-error: true  # No bloquear release (políticas son informativas)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for policies file
        id: check-policies
        run: |
          if [ -f .stackql/policies.sql ]; then
            echo "has-policies=true" >> $GITHUB_OUTPUT
            echo "✅ Found .stackql/policies.sql"
          else
            echo "has-policies=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No .stackql/policies.sql found (optional feature)"
          fi

      - name: Install StackQL
        if: steps.check-policies.outputs.has-policies == 'true'
        run: |
          echo "📥 Installing StackQL..."
          curl -s https://stackql.io/install.sh | bash
          stackql --version

      - name: Run StackQL policies
        if: steps.check-policies.outputs.has-policies == 'true'
        run: |
          echo "📋 Running StackQL policy enforcement..."
          stackql exec --file .stackql/policies.sql || {
            echo ""
            echo "⚠️ StackQL policy enforcement failed"
            echo "   Check .stackql/policies.sql for details"
            echo ""
            exit 1
          }
          echo "✅ All StackQL policies passed"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5: Cleanup — Cierre Automático de Issues/PRs Stale
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Mantener el repositorio limpio cerrando automáticamente issues y PRs
  #   inactivos por más de 30 días (con advertencia de 7 días antes).
  # 
  # EXCEPCIONES:
  #   - Issues/PRs con labels: pinned, security, bug
  #   - Issues/PRs con actividad reciente (comentarios, commits)
  # ════════════════════════════════════════════════════════════════════════════
  
  stale:
    name: 🧹 Cleanup Stale Issues/PRs
    runs-on: ubuntu-latest
    if: always()  # Siempre ejecutar (cleanup independiente del release)
    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            ⚠️ **Este issue está inactivo por 30 días**
            
            Se cerrará automáticamente si no hay actividad en los próximos 7 días.
            
            Si este issue sigue siendo relevante, por favor comenta para mantenerlo abierto.
          stale-pr-message: |
            ⚠️ **Este PR está inactivo por 30 días**
            
            Se cerrará automáticamente si no hay actividad en los próximos 7 días.
            
            Si este PR sigue siendo relevante, por favor actualízalo o comenta.
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "pinned,security,bug,enhancement,documentation"
          exempt-pr-labels: "pinned,security,bug,enhancement,documentation"
          exempt-all-milestones: true
          operations-per-run: 100
          remove-stale-when-updated: true

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 6: Post-Release Notification — Notificación Multi-Canal
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Notificar al equipo sobre el nuevo release a través de múltiples canales:
  #   - GitHub: Release publicado (automático)
  #   - Discord: Webhook notification (opcional)
  #   - Artifacts: Disponibles para descarga/verificación
  # ════════════════════════════════════════════════════════════════════════════
  
  post-release:
    name: 📢 Post-Release Notification
    runs-on: ubuntu-latest
    needs: [release_build, security-scan, stackql]
    if: always() && needs.release_build.result == 'success'
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Display release summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "🎉 RELEASE ${{ env.RELEASE_TAG }} PUBLISHED"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "📦 Artifacts:"
          ls -lh artifacts/
          echo ""
          echo "🔗 Release URL:"
          echo "   https://github.com/${{ env.REPOSITORY }}/releases/tag/${{ env.RELEASE_TAG }}"
          echo ""
          echo "🛡️ Security Scans:"
          echo "   Check GitHub Security tab for results"
          echo ""
          echo "📋 StackQL Policies:"
          echo "   Status: ${{ needs.stackql.result }}"
          echo ""
          echo "═══════════════════════════════════════════════════════"

      - name: Notify Discord (optional webhook)
        if: ${{ secrets.DISCORD_RELEASE_WEBHOOK != '' }}
        run: |
          echo "📢 Sending Discord notification..."
          
          # Determine color based on prerelease
          if [[ "${{ env.RELEASE_TAG }}" == *"-rc"* ]]; then
            COLOR=15158332  # Orange for prerelease
            TITLE="🧪 Release Candidate Published"
          else
            COLOR=5814783   # Green for stable release
            TITLE="🎉 Production Release Published"
          fi
          
          curl -X POST "${{ secrets.DISCORD_RELEASE_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "'"${TITLE}"'",
                "description": "Isabella Gateway **${{ env.RELEASE_TAG }}**",
                "url": "https://github.com/${{ env.REPOSITORY }}/releases/tag/${{ env.RELEASE_TAG }}",
                "color": '"${COLOR}"',
                "fields": [
                  {
                    "name": "📦 Tag",
                    "value": "'"${{ env.RELEASE_TAG }}"'",
                    "inline": true
                  },
                  {
                    "name": "🔗 Commit",
                    "value": "'"${{ github.sha }}"'",
                    "inline": true
                  },
                  {
                    "name": "👤 Author",
                    "value": "'"${{ github.actor }}"'",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "Isabella Genesis CI/CD",
                  "icon_url": "https://github.githubassets.com/images/modules/logos/page/GitHub-Mark.png"
                },
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' || {
              echo "⚠️ Discord notification failed (webhook may be invalid)"
            }
        continue-on-error: true

      - name: Upload final release report
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ env.RELEASE_TAG }}
          path: artifacts/
          retention-days: 90
Mejoras Enterprise Implementadas
Dimensión	Mejora	Impacto
Documentación	Headers ASCII, comentarios extensos, propósito por job	✅ Onboarding rápido, audit trail completo
Validación	Check detallado de secrets con count y lista	✅ Debugging inmediato si falta algo
Build	Validación de output con file count	✅ Fail-fast si build no genera archivos
Artefactos	Checksum SHA256 + instrucciones de verificación	✅ Integridad verificable post-download
Release Notes	Auto-generate desde CHANGELOG.md con fallback	✅ Notas útiles, no genéricas
Prerelease	Detección automática de tags -rc	✅ RC marcados como prerelease en GitHub
Security	Scans post-release (non-blocking) con continue-on-error	✅ Reporta sin bloquear (validación ya pasó en CI)
StackQL	Check previo + install condicional + error handling	✅ Skip graceful si no hay policies
Stale	Labels exempt, milestones exempt, remove-stale-when-updated	✅ Cleanup inteligente, no cierra importantes
Notificación	Discord webhook con embed, color por tipo de release	✅ Equipo notificado con contexto
Trazabilidad	Outputs con URLs, artifact names, checksums	✅ Link directo desde pipeline a release
Retención	30 días artifacts, 90 días release report	✅ Auditoría a largo plazo
