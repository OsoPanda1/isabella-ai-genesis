name: Isabella Genesis — Dependency Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.15.4"

jobs:
  dependency-contract:
    name: Frozen dependency contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Print package contract
        run: |
          node --version
          pnpm --version
          node -e "const p=require('./package.json'); console.log(JSON.stringify({packageManager:p.packageManager,engines:p.engines},null,2))"

      - name: Frozen install
        id: frozen-install
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee dependency-install.log
          exit ${PIPESTATUS[0]}

      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: dependency-contract-diagnostics-${{ github.run_id }}
          path: dependency-install.log
          retention-days: 7
          if-no-files-found: error

      - name: Enforce frozen install
        if: steps.frozen-install.outcome != 'success'
        run: exit 1

      - name: Verify dependency tree
        run: pnpm list --depth 0
