# Configuración oficial de CodeQL para isabella-ai-genesis.
# Referencia: https://docs.github.com/en/code-security/code-scanning/using-codeql-code-scanning-with-your-existing-ci-system/using-codeql-runner-in-your-ci-system#using-a-custom-configuration-file
# Solo se usan claves soportadas: name, disable-default-queries, queries,
# packs, paths, paths-ignore y query-filters. La validación estricta de
# secretos y runtime se mantiene en src/lib/env-schema.ts y en el job
# env-check de CI (warn-only en PRs, estricto en push/tags).
name: isabella-codeql

queries:
  - uses: security-and-quality

paths-ignore:
  - node_modules
  - dist
  - .output
  - coverage
  - test
  - tests
  - __mocks__
  - __fixtures__
  - public
  - src/components/ui
  - "**/*.gen.ts"
