# Isabella Genesis — canonical CodeQL configuration
# Keep this file intentionally conservative: only documented CodeQL configuration
# keys are used so the security gate fails on findings, not configuration syntax.
name: isabella-codeql

queries:
  - uses: security-extended

paths:
  - src
  - scripts

paths-ignore:
  - node_modules
  - dist
  - .output
  - .vercel
  - .next
  - build
  - test
  - tests
  - coverage
  - public
  - static
  - assets
  - docs
  - supabase/migrations
  - "**/*.gen.ts"
  - "**/*.generated.ts"
  - "**/*.d.ts"
