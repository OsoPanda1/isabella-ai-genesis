# .github/codeql-config.yml
# ════════════════════════════════════════════════════════════════════════════
# Isabella Genesis — CodeQL Configuration (Enterprise-Grade)
# ════════════════════════════════════════════════════════════════════════════
# Version: 2026.9.1-military-grade
#
# PROPÓSITO:
#   Configuración de CodeQL para análisis estático avanzado (SAST) que detecta
#   vulnerabilidades de seguridad, bugs de código, y anti-patrones en
#   JavaScript/TypeScript.
#
# DOCUMENTACIÓN OFICIAL:
#   https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
#
# CLAVES SOPORTADAS (GitHub CodeQL v2.16+):
#   - name: Identificador del configuration
#   - disable-default-queries: Usar solo queries personalizadas
#   - queries: Query suites y queries individuales
#   - packs: CodeQL packs personalizados
#   - paths: Directorios a escanear
#   - paths-ignore: Directorios a excluir
#   - query-filters: Filtrar queries por severity, tags, etc.
#
# QUERY SUITES USADAS:
#   - security-extended: Vulnerabilidades de seguridad (extended)
#   - security-and-quality: Seguridad + calidad de código
#   - code-security: Security-specific queries
#
# CARACTERÍSTICAS ENTERPRISE:
#   ✅ Query suites optimizadas (security-extended + security-and-quality)
#   ✅ Exclusiones inteligentes (node_modules, dist, tests, generated)
#   ✅ Path filters (solo código de producción: src/)
#   ✅ Query filters (severity: critical, high, medium)
#   ✅ Custom packs (opcional, para queries personalizadas)
#   ✅ Integration con GitHub Security tab
#   ✅ Trazabilidad completa (query → resultado → fix)
#
# INTEGRACIÓN:
#   - security.yml: CodeQL job usa esta config
#   - GitHub Security: Todos los resultados centralizados
#   - PR Checks: CodeQL results como gate de merge
#
# DOCUMENTACIÓN:
#   - CodeQL Queries: https://codeql.github.com/codeql-query-help/
#   - Custom Config: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
# ════════════════════════════════════════════════════════════════════════════

name: isabella-codeql-enterprise

# ════════════════════════════════════════════════════════════════════════════
# QUERY SUITES
# ════════════════════════════════════════════════════════════════════════════
# PROPÓSITO:
#   Definir qué queries de CodeQL se ejecutarán en el análisis.
#
# QUERY SUITES DISPONIBLES (JavaScript/TypeScript):
#   - security-extended: Vulnerabilidades de seguridad (extended coverage)
#   - security-and-quality: Seguridad + calidad de código (recommended)
#   - code-security: Security-specific queries (critical only)
#   - default-suite: Default queries (menos exhaustivo)
#
# SELECCIÓN:
#   Usamos security-extended + security-and-quality para cobertura máxima.
#   Esto incluye:
#     - SQL/NoSQL Injection
#     - XSS (Cross-Site Scripting)
#     - Path Traversal
#     - Command Injection
#     - Unsafe Deserialization
#     - Hardcoded Credentials
#     - Weak Cryptography
#     - Security Misconfigurations
#     - Code Quality Issues
#     - Maintainability Problems
# ════════════════════════════════════════════════════════════════════════════

queries:
  # Query suites principales (security-focused)
  - uses: security-extended
  - uses: security-and-quality

  # Query suite adicional (code-security, critical only)
  # - uses: code-security  # Opcional, para análisis más estricto

# ════════════════════════════════════════════════════════════════════════════
# DISABLE DEFAULT QUERIES
# ════════════════════════════════════════════════════════════════════════════
# PROPÓSITO:
#   Controlar si se ejecutan las queries por defecto de GitHub además de las
#   personalizadas.
#
# CONFIGURACIÓN:
#   false → Ejecutar queries por defecto + personalizadas (default)
#   true → Solo ejecutar queries personalizadas
#
# RECOMENDACIÓN:
#   Mantener false para cobertura máxima (default + security-extended).
# ════════════════════════════════════════════════════════════════════════════

disable-default-queries: false

# ════════════════════════════════════════════════════════════════════════════
# PATHS (DIRECTORIOS A ESCANEAR)
# ════════════════════════════════════════════════════════════════════════════
# PROPÓSITO:
#   Definir qué directorios se incluirán en el análisis de CodeQL.
#
# ESTRATEGIA:
#   - Incluir solo código de producción (src/)
#   - Excluir tests, generated code, y dependencies
#   - Incluir scripts críticos (scripts/*.mjs)
#
# NOTA:
#   Si no se especifica, CodeQL escanea todo el repositorio (excepto paths-ignore).
# ════════════════════════════════════════════════════════════════════════════

paths:
  - src # Código de producción (principal)
  - scripts # Scripts críticos (deploy, migrations, etc.)

# ════════════════════════════════════════════════════════════════════════════
# PATHS-IGNORE (DIRECTORIOS A EXCLUIR)
# ════════════════════════════════════════════════════════════════════════════
# PROPÓSITO:
#   Excluir directorios del análisis de CodeQL para reducir ruido y mejorar
#   performance.
#
# CATEGORÍAS EXCLUIDAS:
#   1. Dependencies (node_modules, dist, .output)
#   2. Tests (test, tests, __mocks__, __fixtures__, coverage)
#   3. Generated Code (*.gen.ts, *.generated.ts)
#   4. Public Assets (public, static)
#   5. UI Components (src/components/ui) - solo estilos, no lógica
#   6. Build Artifacts (.next, .nuxt, build)
#
# JUSTIFICACIÓN:
#   - node_modules: Dependencies ya escaneadas por npm audit + Trivy
#   - dist/.output: Build artifacts, no código fuente
#   - tests: Tests no van a producción, ruido innecesario
#   - generated: Código generado, fixes se pierden en regen
#   - public: Assets estáticos, no código ejecutable
#   - src/components/ui: Solo componentes de UI (Tailwind, etc.)
# ════════════════════════════════════════════════════════════════════════════

paths-ignore:
  # Dependencies y build artifacts
  - node_modules
  - dist
  - .output
  - .next
  - .nuxt
  - build

  # Tests y fixtures
  - test
  - tests
  - __mocks__
  - __fixtures__
  - coverage
  - vitest.config.ts
  - jest.config.js

  # Generated code
  - "**/*.gen.ts"
  - "**/*.generated.ts"
  - "**/*.d.ts"
  - supabase/migrations

  # Public assets y static files
  - public
  - static
  - assets

  # UI components (solo estilos, no lógica crítica)
  - src/components/ui

  # Configuration files
  - "*.config.ts"
  - "*.config.js"
  - "*.config.mjs"

  # Documentation
  - docs
  - "*.md"

# ════════════════════════════════════════════════════════════════════════════
# QUERY FILTERS
# ════════════════════════════════════════════════════════════════════════════
# PROPÓSITO:
#   Filtrar queries por severidad, tags, o otras propiedades para reducir
#   ruido y enfocarse en lo crítico.
#
# FILTROS DISPONIBLES:
#   - kind: problem, path-problem
#   - severity: critical, high, medium, low, recommendation
#   - tags: security, correctness, maintainability, etc.
#
# ESTRATEGIA:
#   - Incluir solo critical, high, medium (excluir low/recommendation)
#   - Priorizar security y correctness tags
#   - Excluir maintainability (ya cubierto por ESLint)
#
# NOTA:
#   Los filtros son opcionales. Si no se especifican, se incluyen todas las queries.
# ════════════════════════════════════════════════════════════════════════════

query-filters:
  # Incluir solo severidad crítica, alta y media
  - exclude:
      severity: low
  - exclude:
      severity: recommendation

  # Incluir solo security y correctness (excluir maintainability)
  - include:
      tags: security
  - include:
      tags: correctness

  # Excluir queries de performance (ya cubierto por profiling)
  - exclude:
      tags: performance

# ════════════════════════════════════════════════════════════════════════════
# PACKS (CODEQL PACKS PERSONALIZADOS)
# ════════════════════════════════════════════════════════════════════════════
# PROPÓSITO:
#   Importar CodeQL packs personalizados con queries específicas para el
#   proyecto o industria.
#
# EJEMPLOS:
#   - codeql/javascript-queries: Queries oficiales de JavaScript
#   - codeql/typescript-queries: Queries oficiales de TypeScript
#   - custom/security-pack: Pack personalizado (si existe)
#
# NOTA:
#   Los packs son opcionales. Las query suites ya incluyen las queries oficiales.
# ════════════════════════════════════════════════════════════════════════════

# packs:
#   - codeql/javascript-queries
#   - codeql/typescript-queries

# ════════════════════════════════════════════════════════════════════════════
# TRAP CACHING (OPCIONAL, PARA PERFORMANCE)
# ════════════════════════════════════════════════════════════════════════════
# PROPÓSITO:
#   Configurar caching de TRAP files (intermediate representation) para
#   acelerar análisis incrementales.
#
# NOTA:
#   GitHub Actions ya maneja caching automáticamente. Esta configuración es
#   opcional y solo necesaria para CI self-hosted.
# ════════════════════════════════════════════════════════════════════════════

# trap-caching: true  # Default: true (GitHub Actions lo maneja)

# ════════════════════════════════════════════════════════════════════════════
# NOTAS DE SEGURIDAD
# ════════════════════════════════════════════════════════════════════════════
#
# 1. SECRETOS EN CÓDIGO:
#    CodeQL detecta hardcoded credentials (API keys, passwords, etc.).
#    Si se detectan, el pipeline falla en PRs (ver security.yml).
#
# 2. INYECCIÓN SQL/NOSQL:
#    CodeQL detecta queries dinámicas sin parameterization.
#    Usar siempre parameterized queries (Prisma, prepared statements).
#
# 3. XSS (CROSS-SITE SCRIPTING):
#    CodeQL detecta renderizado de input de usuario sin escaping.
#    Usar siempre librerías de escaping (DOMPurify, etc.).
#
# 4. PATH TRAVERSAL:
#    CodeQL detecta acceso a filesystem con input de usuario.
#    Validar y sanitizar paths antes de usar.
#
# 5. COMANDOS OS:
#    CodeQL detecta exec/spawn con input de usuario.
#    Evitar comandos OS con input dinámico.
#
# ════════════════════════════════════════════════════════════════════════════
#
# DOCUMENTACIÓN ADICIONAL:
#
# - CodeQL Queries: https://codeql.github.com/codeql-query-help/
# - Custom Config: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
# - Query Suites: https://docs.github.com/en/code-security/code-scanning/using-codeql-code-scanning-with-your-existing-ci-system/configuring-code-scanning#using-queries-in-ql-packs
# - GitHub Security: https://github.com/features/security
#
# ════════════════════════════════════════════════════════════════════════════
