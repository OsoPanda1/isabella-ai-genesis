[project]
name = "quantum-utility-platform"
version = "0.1.0"
description = "Composable, auditable Qiskit utility-scale workflows"
requires-python = ">=3.10"
dependencies = [
  "qiskit>=1.4",
  "qiskit-aer>=0.15",
  "pydantic>=2.8",
  "numpy>=1.26",
  "structlog>=24.4"
]

[project.optional-dependencies]
runtime = [
  "qiskit-ibm-runtime>=0.36"
]
optimization = [
  "qiskit-addon-opt-mapper",
  "qiskit-addon-aqc-tensor",
  "qiskit-addon-mpf"
]
fermions = [
  "qiskit-fermions"
]
cutting = [
  "qiskit-addon-cutting"
]
mitigation = [
  "mthree"
]
qml = [
  "pennylane>=0.40"
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
